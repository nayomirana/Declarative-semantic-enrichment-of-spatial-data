prefixes:
  ex: "http://example.org/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcat: "http://www.w3.org/ns/dcat#"
  dcterms: "http://purl.org/dc/terms/"
  foaf: "http://xmlns.com/foaf/0.1/"
  idlab-fn: "http://example.com/idlab/function/"
  grel: "http://users.ugent.be/~bjdmeest/function/grel.ttl#"

mappings:
  catalog:
    sources:
      - access: catalog_datasets_list.json
        referenceFormulation: jsonpath
        iterator: '$[*]'
    s: http://wwww.example.com/catalog/datasets/$(title)
    po:
      - [a, dcat:Dataset]
      - [dcterms:title, $(title)]
      - [dcterms:description, $(description)), en~lang]
      - [dcterms:identifier, $(identifier)]
      - [dcterms:issued, $(issued), xsd:dateTime]
      - [dcterms:modified, $(modified), xsd:dateTime]
      - [dcat:landingPage, $(landingPage)~iri]
      - p: dcterms:publisher
        o:
           mapping: publisherMapping 
           condition:
              function: equal
              parameters:
                - [str1, $(publisher.name)]
                - [str2, $(name)]

      - [dcat:keyword, "$(keyword[*])"]
      - [dcterms:language, "http://id.loc.gov/vocabulary/iso639-1/$(language[*])~iri"]
      
      - p: dcat:distribution
        o: "http://wwww.example.com/distribution/$(distribution[*].title)~iri"


  publisherMapping:
    sources:
      - access: catalog_datasets_list.json
        referenceFormulation: jsonpath
        iterator: "$.[*].publisher"
    # s: http://wwww.example.com/publisher/$(name) 
    s: null 
    po:
      - [a, foaf:Agent] 
      - [foaf:name, $(name)]
      - [foaf:mbox, $(mbox)]


  distributionMapping:
    sources:
      - access: catalog_datasets_list.json
        referenceFormulation: jsonpath
        iterator: "$.[*].distribution[*]"
    s: http://wwww.example.com/distribution/$(title) 
    # s: null 
    po:
      - [a, dcat:Distribution]
      - [dcat:accessURL, $(accessURL)~iri]
      - [dcat:byteSize, $(byteSize)]
      - [dcterms:description, $(description)), en~lang]
      - [dcat:downloadURL, $(downloadURL)~iri]
      - [dcterms:format, $(format)]
      - [dcterms:issued, $(issued), xsd:date]
      - [dcterms:license, $(license)]
      - [dcterms:modified, $(modified), xsd:date]
      - [dcterms:title, $(title)]   
