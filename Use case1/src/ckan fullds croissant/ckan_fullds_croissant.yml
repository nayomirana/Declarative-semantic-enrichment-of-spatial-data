prefixes:
  ex: "http://example.org/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcat: "http://www.w3.org/ns/dcat#"
  dcterms: "http://purl.org/dc/terms/"
  foaf: "http://xmlns.com/foaf/0.1/"
  adms: "https://www.w3.org/ns/adms#"
  owl: "http://www.w3.org/2002/07/owl#"
  cnt: "http://www.w3.org/2008/content#"
  spdx: "http://spdx.org/rdf/terms#"

mappings:
  datasetMappping:
    sources:
      - access: ckan_fullds_croissant.json
        referenceFormulation: jsonpath
        iterator: "$"
    s: http://wwww.example.com/dataset/$(title)
    po:
      - [a, dcat:Dataset]
      - [dcterms:identifier, $(id)]
      - [dcterms:title, $(title)] 
      - [dcterms:description, $(notes), en~lang]
      - [adms:identifier, $(id_given)]  ## custom:alternate_identifier
      - [dcat:landingPage, $(url)~iri]
      - [owl:versionInfo, $(version)]
      - [dcat:keyword, "$(tags[*].name)"]
      - [dcterms:issued, $(created), xsd:date]
      - [dcterms:issued, $(issued), xsd:date]
      - [dcterms:modified, $(modified), xsd:date]
      - [dcterms:license, $(license)~iri]
      - [dcterms:license, $(structured_data_license)~iri]
      - [dcterms:language, "http://id.loc.gov/vocabulary/iso639-1/$(language[*])~iri"]
      - p: dcterms:creator
        o:
          - mapping: creatorMapping

      - p: dcterms:publisher
        o:
          - mapping: publisherMapping

      - p: dcat:distribution
        o:
          - mapping: distributionMapping

      - [owl:sameAs, "$(same_as[*])~iri"]

  creatorMapping:
    sources:
      - access: ckan_fullds_croissant.json
        referenceFormulation: jsonpath
        iterator: "$.creator[*]"
    s: http://wwww.example.com/creator/$(name)
    po:
      - [a, foaf:Agent]
      - [foaf:name, $(name)]
      - [foaf:mbox, $(email)]
      - [foaf:homepage, $(url)]
      - [dcterms:identifier, $(identifier)]
      - [dcterms:type, $(type)]
      - [dcterms:identifier, $(id_given)] ## Id_given 

  publisherMapping:
    sources:
      - access: ckan_fullds_croissant.json
        referenceFormulation: jsonpath
        iterator: "$.publisher[*]"
    s: http://wwww.example.com/publisher/$(name)
    po:
      - [a, foaf:Agent]
      - [foaf:name, $(name)]
      - [foaf:mbox, $(email)]
      - [foaf:homepage, $(url)]
      - [dcterms:identifier, $(identifier)]
      - [dcterms:type, $(type)]
      - [dcterms:identifier, $(id_given)] 


  distributionMapping:
    sources:
      - access: ckan_fullds_croissant.json
        referenceFormulation: jsonpath
        iterator: "$.resources[*]"
    s: http://wwww.example.com/distribution/$(name) 
    po:
      - [a, dcat:Distribution]
      - [dcterms:identifier, $(id)]
      - [dcterms:title, $(name)]   
      - [dcterms:description, $(description), en~lang]
      - [dcat:accessURL, $(url)~iri]
      - [dcterms:format, $(format)]
      - [dcterms:identifier, $(id_given)] 
      - [dcat:byteSize, $(size)]
      - [spdx:checksum, $(hash)]
      - p : dcat:accessService
        o:
          - mapping: sub_distributionMapping
     
  sub_distributionMapping:
    sources:
      - access: ckan_fullds_croissant.json
        referenceFormulation: jsonpath
        iterator: "$.resources[*].subresources[*]"
    s: http://wwww.example.com/sub_distribution/$(id_given) 
    po:
      - [a, dcat:Distribution]
      - [dcterms:identifier, $(id_given)]
      - [dcat:accessURL, $(url)~iri]
      - [dcterms:description, $(description)]
      - [dcat:byteSize, $(size)]
      - [dcterms:format, $(format)]
      - [dcat:mediaType, $(mimetype)]



