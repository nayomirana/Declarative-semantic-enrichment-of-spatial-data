prefixes:
  ex: "http://www.example.com/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcat: "http://www.w3.org/ns/dcat#"
  dcterms: "http://purl.org/dc/terms/"
  foaf: "http://xmlns.com/foaf/0.1/"
  adms: "https://www.w3.org/ns/adms#"
  owl: "http://www.w3.org/2002/07/owl#"
  cnt: "http://www.w3.org/2008/content#"
  spdx: "http://spdx.org/rdf/terms#"


sources:
  dataset_source:
    [ckan_fullds_croissant.json~jsonpath, "$"]
  creator_source:
    [ckan_fullds_croissant.json~jsonpath, "$.creator[*]"]
  publisher_source:
    [ckan_fullds_croissant.json~jsonpath, "$.publisher[*]"]
  distribution_source:
    [ckan_fullds_croissant.json~jsonpath, "$.resources[*]"]
  sub_distribution_source:
    [ckan_fullds_croissant.json~jsonpath, "$.resources[*].subresources[*]"]

mappings:
  dataset:
    sources: dataset_source
    s: ex:dataset/$(title)
    po:
      - [a, dcat:Dataset]
      - [dcterms:identifier, $(id)]
      - [dcterms:title, $(title)] 
      - [dcterms:description, $(notes), en~lang]
      - [adms:identifier, $(id_given)]  ## custom:alternate_identifier
      - [dcat:landingPage, $(url)~iri]
      - [owl:versionInfo, $(version)]
      - [dcat:keyword, "$(tags[*].name)"]
      - [dcterms:issued, $(created), xsd:date]
      - [dcterms:issued, $(issued), xsd:date]
      - [dcterms:modified, $(modified), xsd:date]
      - [dcterms:license, $(license)~iri]
      - [dcterms:license, $(structured_data_license)~iri]
      - [dcterms:language, "http://id.loc.gov/vocabulary/iso639-1/$(language[*])~iri"]
      - p: dcterms:creator
        o:
          - mapping: creator

      - p: dcterms:publisher
        o:
          - mapping: publisher

      - p: dcat:distribution
        o:
          - mapping: distribution

      - [owl:sameAs, "$(same_as[*])~iri"]

  creator:
    sources: creator_source
    s: null
    po:
      - [a, foaf:Agent]
      - [foaf:name, $(name)]
      - [foaf:mbox, $(email)]
      - [foaf:homepage, $(url)]
      - [dcterms:identifier, $(identifier)]
      - [dcterms:type, $(type)]
      - [dcterms:identifier, $(id_given)] ## Id_given 

  publisher:
    sources: publisher_source
    s: null
    po:
      - [a, foaf:Agent]
      - [foaf:name, $(name)]
      - [foaf:mbox, $(email)]
      - [foaf:homepage, $(url)]
      - [dcterms:identifier, $(identifier)]
      - [dcterms:type, $(type)]
      - [dcterms:identifier, $(id_given)] 


  distribution:
    sources: distribution_source
    s: ex:distribution/$(name) 
    po:
      - [a, dcat:Distribution]
      - [dcterms:identifier, $(id)]
      - [dcterms:title, $(name)]   
      - [dcterms:description, $(description), en~lang]
      - [dcat:accessURL, $(url)~iri]
      - [dcterms:format, $(format)]
      - [dcterms:identifier, $(id_given)] 
      - [dcat:byteSize, $(size)]
      - [spdx:checksum, $(hash)]
      - p : dcat:accessService
        o:
          - mapping: sub_distribution
     
  sub_distribution:
    sources: sub_distribution_source
    s: ex:sub_distribution/$(id_given) 
    po:
      - [a, dcat:DataService]
      - [dcterms:identifier, $(id_given)]
      - [dcat:accessURL, $(url)~iri]
      - [dcterms:description, $(description)]
      - [dcat:byteSize, $(size)]
      - [dcterms:format, $(format)]
      - [dcat:mediaType, $(mimetype)]
